name: 毎日レシピ自動投稿

on:
  schedule:
    - cron: '0 0 * * *'  # 毎日 0:00 UTC = 日本時間 9:00
  workflow_dispatch:       # 手動実行ボタンも有効化

jobs:
  post-daily-recipe:
    runs-on: ubuntu-latest
    steps:
      - name: レシピ生成・ショーケース掲載・X投稿
        run: |
          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://golden-ratio-app-zeta.vercel.app/api/cron-daily-recipe)
          echo "HTTP Status: $HTTP_STATUS"
          echo "Response:"
          cat response.json
          if [ "$HTTP_STATUS" != "200" ]; then
            exit 1
          fi
